apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "caipe.fullname" . }}-app-config
  labels:
    {{- include "caipe.labels" . | nindent 4 }}
data:
  app-config.yaml: |
    # CAIPE Application Seed Configuration
    models:
      - model_id: "gemini-2.5-flash"
        name: "Gemini 2.5 Flash"
        provider: "openai"
        description: "Google Gemini 2.5 Flash via LiteLLM (Default)"
      - model_id: "gpt-4o"
        name: "GPT-4o"
        provider: "openai"
        description: "OpenAI GPT-4o via LiteLLM"
      - model_id: "gemini-1.5-flash"
        name: "Gemini 1.5 Flash"
        provider: "openai"
        description: "Google Gemini 1.5 Flash via LiteLLM"
      - model_id: "gemini-1.5-pro"
        name: "Gemini 1.5 Pro"
        provider: "openai"
        description: "Google Gemini 1.5 Pro via LiteLLM"
      - model_id: "gpt-3.5-turbo"
        name: "GPT-3.5 Turbo"
        provider: "openai"
        description: "OpenAI GPT-3.5 Turbo via LiteLLM"
    mcp_servers: []
    agents: []
    workflow_configs: []
    rag_sources: []
